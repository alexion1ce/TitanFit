<svg width="1260" height="980" viewBox="0 0 1260 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b0f"/>
      <stop offset="1" stop-color="#111720"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6057"/>
      <stop offset="1" stop-color="#ff2f38"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26e8ba"/>
      <stop offset="1" stop-color="#057d65"/>
    </linearGradient>
    <style>
      .phone { fill: url(#bg); stroke: #252b35; stroke-width: 2; }
      .muted { fill: #a6acb8; font: 22px Arial, sans-serif; }
      .tiny { fill: #a6acb8; font: 18px Arial, sans-serif; }
      .title { fill: #f7f8fb; font: 700 38px Arial, sans-serif; }
      .h2 { fill: #f7f8fb; font: 700 25px Arial, sans-serif; }
      .body { fill: #f7f8fb; font: 700 21px Arial, sans-serif; }
      .card { fill: #141820; stroke: #2b313d; stroke-width: 2; }
      .card2 { fill: #1b2029; stroke: #333a48; stroke-width: 2; }
      .chip { fill: #191e27; stroke: #343b48; stroke-width: 2; }
      .active { fill: url(#red); }
      .accent { fill: #ff4b4b; }
      .green { fill: #22d6ab; }
      .line { stroke: #303746; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1260" height="980" fill="#050607"/>
  <text x="48" y="62" class="title">3 варианта дизайна каталога</text>
  <text x="48" y="96" class="muted">Цель: быстрее найти упражнение, понять мышцы/оборудование и сразу перейти к действию.</text>

  <!-- Variant 1 -->
  <g transform="translate(40,130)">
    <rect class="phone" x="0" y="0" rx="34" width="360" height="760"/>
    <text x="26" y="64" class="title">Каталог</text>
    <text x="26" y="94" class="muted">69 упражнений</text>
    <rect x="24" y="122" width="312" height="64" rx="20" class="card"/>
    <circle cx="58" cy="154" r="13" fill="none" stroke="#a6acb8" stroke-width="4"/>
    <line x1="68" y1="164" x2="80" y2="176" stroke="#a6acb8" stroke-width="4" stroke-linecap="round"/>
    <text x="98" y="163" class="muted">Поиск упражнения</text>

    <rect x="24" y="212" width="96" height="44" rx="18" class="active"/>
    <text x="45" y="241" class="body">Все</text>
    <rect x="132" y="212" width="112" height="44" rx="18" class="chip"/>
    <text x="153" y="241" class="body">Мышцы</text>
    <rect x="256" y="212" width="80" height="44" rx="18" class="chip"/>
    <text x="274" y="241" class="body">Инв.</text>

    <text x="24" y="304" class="h2">Быстрый выбор</text>
    <g transform="translate(24,324)">
      <rect width="148" height="88" rx="20" class="card2"/>
      <text x="18" y="36" class="body">💪 Бицепс</text>
      <text x="18" y="66" class="tiny">8 упражнений</text>
      <rect x="164" width="148" height="88" rx="20" class="card2"/>
      <text x="182" y="36" class="body">🏋️ Грудь</text>
      <text x="182" y="66" class="tiny">12 упражнений</text>
    </g>

    <text x="24" y="456" class="h2">Упражнения</text>
    <g transform="translate(24,478)">
      <rect width="312" height="96" rx="20" class="card"/>
      <rect x="14" y="14" width="68" height="68" rx="16" fill="#fff"/>
      <text x="98" y="40" class="body">Молотки</text>
      <text x="98" y="66" class="tiny">Бицепс · Гантели</text>
      <circle cx="282" cy="48" r="20" fill="#0b493d"/>
      <text x="276" y="56" fill="#fff" font="700 23px Arial">+</text>
      <rect y="112" width="312" height="96" rx="20" class="card"/>
      <rect x="14" y="126" width="68" height="68" rx="16" fill="#fff"/>
      <text x="98" y="152" class="body">Жим над головой</text>
      <text x="98" y="178" class="tiny">Плечи · Штанга</text>
      <circle cx="282" cy="160" r="20" fill="#0b493d"/>
      <text x="276" y="168" fill="#fff" font="700 23px Arial">+</text>
    </g>
    <text x="0" y="812" class="h2">1. Быстрый каталог</text>
    <text x="0" y="842" class="muted">Лучший базовый вариант: поиск, фильтры, компактные карточки.</text>
  </g>

  <!-- Variant 2 -->
  <g transform="translate(450,130)">
    <rect class="phone" x="0" y="0" rx="34" width="360" height="760"/>
    <text x="26" y="64" class="title">Каталог</text>
    <rect x="24" y="104" width="312" height="52" rx="18" class="card"/>
    <text x="52" y="138" class="muted">Поиск или мышца</text>
    <g transform="translate(24,178)">
      <rect width="92" height="42" rx="18" class="active"/>
      <text x="22" y="28" class="body">Тело</text>
      <rect x="104" width="96" height="42" rx="18" class="chip"/>
      <text x="125" y="28" class="body">Инв.</text>
      <rect x="212" width="100" height="42" rx="18" class="chip"/>
      <text x="231" y="28" class="body">Цель</text>
    </g>
    <rect x="42" y="246" width="276" height="220" rx="26" fill="#11161d" stroke="#2e3542" stroke-width="2"/>
    <ellipse cx="180" cy="336" rx="58" ry="118" fill="#232b35"/>
    <ellipse cx="180" cy="282" rx="36" ry="34" fill="#2f3945"/>
    <rect x="134" y="346" width="92" height="108" rx="38" fill="#2f3945"/>
    <path d="M139 348 C94 370 92 430 108 458" fill="none" stroke="#ff4b4b" stroke-width="18" stroke-linecap="round"/>
    <path d="M221 348 C266 370 268 430 252 458" fill="none" stroke="#ff4b4b" stroke-width="18" stroke-linecap="round"/>
    <text x="74" y="504" class="h2">Выбрано: грудь</text>
    <text x="74" y="534" class="muted">12 упражнений · 4 тренажера</text>

    <g transform="translate(24,574)">
      <rect width="312" height="78" rx="18" class="card"/>
      <text x="18" y="34" class="body">Жим лёжа</text>
      <text x="18" y="58" class="tiny">Грудь · Штанга · база</text>
      <rect y="92" width="312" height="78" rx="18" class="card"/>
      <text x="18" y="126" class="body">Бабочка в тренажёре</text>
      <text x="18" y="150" class="tiny">Грудь · Тренажёр · изоляция</text>
    </g>
    <text x="0" y="812" class="h2">2. Карта мышц</text>
    <text x="0" y="842" class="muted">Для новичков: выбрать мышцу глазами, потом упражнение.</text>
  </g>

  <!-- Variant 3 -->
  <g transform="translate(860,130)">
    <rect class="phone" x="0" y="0" rx="34" width="360" height="760"/>
    <text x="26" y="64" class="title">Каталог</text>
    <rect x="24" y="94" width="312" height="116" rx="24" fill="#131820" stroke="#2d3542" stroke-width="2"/>
    <text x="46" y="132" class="tiny">Рекомендовано сегодня</text>
    <text x="46" y="166" class="h2">Без перегруза плеч</text>
    <text x="46" y="194" class="tiny">8 замен для верхней части</text>
    <circle cx="292" cy="152" r="30" fill="url(#green)"/>
    <text x="282" y="162" fill="#06120f" font="700 26px Arial">→</text>

    <rect x="24" y="236" width="312" height="54" rx="18" class="card"/>
    <text x="56" y="271" class="muted">Поиск, мышца, тренажёр</text>
    <g transform="translate(24,314)">
      <rect width="104" height="42" rx="18" class="active"/>
      <text x="22" y="28" class="body">Все</text>
      <rect x="116" width="96" height="42" rx="18" class="chip"/>
      <text x="135" y="28" class="body">Недав.</text>
      <rect x="224" width="88" height="42" rx="18" class="chip"/>
      <text x="241" y="28" class="body">Избр.</text>
    </g>
    <text x="24" y="404" class="h2">Популярные</text>
    <g transform="translate(24,426)">
      <rect width="312" height="108" rx="20" class="card"/>
      <rect x="14" y="14" width="76" height="80" rx="16" fill="#fff"/>
      <text x="106" y="40" class="body">Приседания</text>
      <text x="106" y="66" class="tiny">Ноги · Штанга</text>
      <rect x="106" y="76" width="76" height="24" rx="12" fill="#322a14"/>
      <text x="120" y="94" fill="#f6c75a" font="16px Arial">Средний</text>
      <text x="282" y="62" class="accent" font="700 27px Arial">+</text>
      <rect y="124" width="312" height="108" rx="20" class="card"/>
      <rect x="14" y="138" width="76" height="80" rx="16" fill="#fff"/>
      <text x="106" y="164" class="body">Тяга блока</text>
      <text x="106" y="190" class="tiny">Спина · Кроссовер</text>
      <rect x="106" y="200" width="86" height="24" rx="12" fill="#12382f"/>
      <text x="120" y="218" fill="#26e8ba" font="16px Arial">Новичок</text>
      <text x="282" y="186" class="accent" font="700 27px Arial">+</text>
    </g>
    <text x="0" y="812" class="h2">3. Умный гибрид</text>
    <text x="0" y="842" class="muted">Каталог + рекомендации + избранное/недавние.</text>
  </g>
</svg>
