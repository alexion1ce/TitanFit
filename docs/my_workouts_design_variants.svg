<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b55"/>
      <stop offset="1" stop-color="#ff342f"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18a78d"/>
      <stop offset="1" stop-color="#075844"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3448"/>
      <stop offset="1" stop-color="#171a21"/>
    </linearGradient>
    <style>
      .bg { fill:#050607; }
      .phone { fill:#07090c; stroke:#1a1f27; stroke-width:2; }
      .status { fill:#0f1319; }
      .title { fill:#f4f5f8; font-family:Inter,Arial,sans-serif; font-size:42px; font-weight:760; }
      .subtitle { fill:#aeb4c0; font-family:Inter,Arial,sans-serif; font-size:22px; }
      .small { fill:#aeb4c0; font-family:Inter,Arial,sans-serif; font-size:19px; }
      .label { fill:#f5f6f8; font-family:Inter,Arial,sans-serif; font-size:26px; font-weight:700; }
      .muted { fill:#b4bac5; font-family:Inter,Arial,sans-serif; font-size:21px; }
      .red { fill:#ff5148; font-family:Inter,Arial,sans-serif; font-size:22px; font-weight:650; }
      .white { fill:#ffffff; font-family:Inter,Arial,sans-serif; font-size:22px; font-weight:650; }
      .card { fill:#171b22; stroke:#2a303a; stroke-width:1.5; }
      .card2 { fill:#15191f; stroke:#28303a; stroke-width:1.5; }
      .pill { fill:#222833; }
      .nav { fill:#101319; }
      .icon { fill:none; stroke:#f4f6f8; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .iconMuted { fill:none; stroke:#b5bac5; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .caption { fill:#d7d9de; font-family:Inter,Arial,sans-serif; font-size:30px; font-weight:760; }
      .caption2 { fill:#88909c; font-family:Inter,Arial,sans-serif; font-size:20px; }
    </style>
  </defs>

  <rect width="1800" height="1320" class="bg"/>

  <text x="72" y="64" class="caption">3 варианта экрана "Мои тренировки"</text>
  <text x="72" y="98" class="caption2">Макеты для выбора направления перед переносом в приложение</text>

  <!-- Variant 1 -->
  <g transform="translate(70 140)">
    <text x="0" y="-28" class="caption">Вариант 1: карточки с метриками</text>
    <rect width="500" height="1040" rx="42" class="phone"/>
    <rect width="500" height="130" rx="38" class="status"/>
    <text x="34" y="86" class="title">Мои тренировки</text>
    <text x="34" y="126" class="subtitle">2 программы для быстрого старта</text>

    <g transform="translate(28 170)" filter="url(#shadow)">
      <rect width="444" height="188" rx="26" class="card"/>
      <rect x="18" y="22" width="72" height="72" rx="18" fill="#0d5b49"/>
      <path d="M40 50h26M40 66h18M40 82h30M68 80l16-16" class="icon"/>
      <text x="112" y="56" class="label">плечи</text>
      <text x="112" y="90" class="muted">3 упражнения • 9 подходов</text>
      <rect x="112" y="116" width="86" height="36" rx="18" class="pill"/>
      <text x="132" y="140" class="small">12 мин</text>
      <rect x="212" y="116" width="98" height="36" rx="18" class="pill"/>
      <text x="232" y="140" class="small">Плечи</text>
      <circle cx="394" cy="74" r="38" fill="#094f3f"/>
      <path d="M386 56l24 18-24 18z" fill="#ffffff"/>
      <text x="32" y="166" class="red">Изменить</text>
      <text x="152" y="166" class="red">Удалить</text>
    </g>

    <g transform="translate(28 384)" filter="url(#shadow)">
      <rect width="444" height="188" rx="26" class="card"/>
      <rect x="18" y="22" width="72" height="72" rx="18" fill="#0d5b49"/>
      <path d="M40 50h26M40 66h18M40 82h30M68 80l16-16" class="icon"/>
      <text x="112" y="56" class="label">пятничная</text>
      <text x="112" y="90" class="muted">плечи и бицепс</text>
      <rect x="112" y="116" width="86" height="36" rx="18" class="pill"/>
      <text x="132" y="140" class="small">18 мин</text>
      <rect x="212" y="116" width="100" height="36" rx="18" class="pill"/>
      <text x="232" y="140" class="small">4 упр.</text>
      <circle cx="394" cy="74" r="38" fill="#094f3f"/>
      <path d="M386 56l24 18-24 18z" fill="#ffffff"/>
      <text x="32" y="166" class="red">Изменить</text>
      <text x="152" y="166" class="red">Удалить</text>
    </g>

    <rect x="285" y="758" width="178" height="74" rx="24" fill="url(#redGrad)"/>
    <text x="322" y="805" class="white">+ Создать</text>
    <g transform="translate(0 902)">
      <rect width="500" height="138" rx="34" class="nav"/>
      <text x="42" y="95" class="small">Каталог</text>
      <text x="153" y="95" class="small">Программы</text>
      <circle cx="250" cy="42" r="58" fill="url(#redGrad)"/>
      <text x="231" y="58" style="fill:white;font-family:Arial;font-size:62px;">+</text>
      <text x="338" y="95" class="small">Прогресс</text>
      <text x="440" y="95" class="red">Мои</text>
    </g>
  </g>

  <!-- Variant 2 -->
  <g transform="translate(650 140)">
    <text x="0" y="-28" class="caption">Вариант 2: плотный рабочий список</text>
    <rect width="500" height="1040" rx="42" class="phone"/>
    <rect width="500" height="130" rx="38" class="status"/>
    <text x="34" y="82" class="title">Мои тренировки</text>
    <rect x="34" y="154" width="432" height="58" rx="18" fill="#111820" stroke="#27303b"/>
    <text x="58" y="191" class="muted">Поиск тренировки</text>

    <g transform="translate(28 244)">
      <rect width="444" height="104" rx="18" class="card2"/>
      <rect x="16" y="18" width="68" height="68" rx="18" fill="#10262d"/>
      <path d="M38 44h24M38 58h18M38 72h28" class="iconMuted"/>
      <text x="104" y="46" class="label">плечи</text>
      <text x="104" y="77" class="muted">3 упражнения • 9 подходов</text>
      <circle cx="356" cy="52" r="30" fill="#103f36"/>
      <path d="M350 38l18 14-18 14z" fill="#ffffff"/>
      <circle cx="416" cy="52" r="30" fill="#26191a"/>
      <path d="M405 52h22M416 41v22" class="icon" transform="rotate(45 416 52)" stroke="#ff5148"/>
    </g>

    <g transform="translate(28 368)">
      <rect width="444" height="104" rx="18" class="card2"/>
      <rect x="16" y="18" width="68" height="68" rx="18" fill="#10262d"/>
      <path d="M38 44h24M38 58h18M38 72h28" class="iconMuted"/>
      <text x="104" y="46" class="label">пятничная</text>
      <text x="104" y="77" class="muted">плечи и бицепс • 4 упр.</text>
      <circle cx="356" cy="52" r="30" fill="#103f36"/>
      <path d="M350 38l18 14-18 14z" fill="#ffffff"/>
      <circle cx="416" cy="52" r="30" fill="#26191a"/>
      <path d="M405 52h22M416 41v22" class="icon" transform="rotate(45 416 52)" stroke="#ff5148"/>
    </g>

    <g transform="translate(28 512)">
      <rect width="444" height="130" rx="22" fill="#101419" stroke="#242c36"/>
      <text x="22" y="42" class="label">Быстрые действия</text>
      <rect x="22" y="66" width="180" height="46" rx="16" fill="url(#redGrad)"/>
      <text x="52" y="97" class="white">+ Новая</text>
      <rect x="218" y="66" width="196" height="46" rx="16" fill="#18212a"/>
      <text x="244" y="97" class="muted">Шаблоны</text>
    </g>

    <g transform="translate(0 902)">
      <rect width="500" height="138" rx="34" class="nav"/>
      <text x="42" y="95" class="small">Каталог</text>
      <text x="153" y="95" class="small">Программы</text>
      <circle cx="250" cy="42" r="58" fill="url(#redGrad)"/>
      <text x="231" y="58" style="fill:white;font-family:Arial;font-size:62px;">+</text>
      <text x="338" y="95" class="small">Прогресс</text>
      <text x="440" y="95" class="red">Мои</text>
    </g>
  </g>

  <!-- Variant 3 -->
  <g transform="translate(1230 140)">
    <text x="0" y="-28" class="caption">Вариант 3: премиум-карты</text>
    <rect width="500" height="1040" rx="42" class="phone"/>
    <rect width="500" height="130" rx="38" class="status"/>
    <text x="34" y="78" class="title">Мои тренировки</text>
    <text x="34" y="116" class="subtitle">Выбери план на сегодня</text>

    <g transform="translate(28 166)" filter="url(#shadow)">
      <rect width="444" height="224" rx="30" fill="url(#violetGrad)" stroke="#37313f"/>
      <rect x="0" y="0" width="8" height="224" rx="4" fill="url(#redGrad)"/>
      <text x="26" y="52" class="label">плечи</text>
      <text x="26" y="86" class="muted">Силовой день • верх тела</text>
      <rect x="26" y="114" width="98" height="38" rx="19" fill="#242a34"/>
      <text x="46" y="139" class="small">3 упр.</text>
      <rect x="136" y="114" width="124" height="38" rx="19" fill="#242a34"/>
      <text x="156" y="139" class="small">9 подходов</text>
      <rect x="26" y="170" width="120" height="38" rx="19" fill="#2b1a1a"/>
      <text x="48" y="195" class="red">Изменить</text>
      <rect x="158" y="170" width="108" height="38" rx="19" fill="#2b1a1a"/>
      <text x="182" y="195" class="red">Удалить</text>
      <circle cx="376" cy="66" r="44" fill="url(#tealGrad)"/>
      <path d="M368 46l28 20-28 20z" fill="#ffffff"/>
    </g>

    <g transform="translate(28 420)" filter="url(#shadow)">
      <rect width="444" height="190" rx="30" fill="#15191f" stroke="#29313c"/>
      <text x="26" y="52" class="label">пятничная</text>
      <text x="26" y="86" class="muted">плечи и бицепс</text>
      <rect x="26" y="118" width="96" height="38" rx="19" fill="#242a34"/>
      <text x="46" y="143" class="small">4 упр.</text>
      <rect x="134" y="118" width="102" height="38" rx="19" fill="#242a34"/>
      <text x="154" y="143" class="small">18 мин</text>
      <circle cx="376" cy="60" r="40" fill="#0d4f40"/>
      <path d="M368 42l24 18-24 18z" fill="#ffffff"/>
    </g>

    <rect x="28" y="656" width="444" height="82" rx="26" fill="url(#redGrad)"/>
    <text x="170" y="708" class="white">+ Создать тренировку</text>

    <g transform="translate(0 902)">
      <rect width="500" height="138" rx="34" class="nav"/>
      <text x="42" y="95" class="small">Каталог</text>
      <text x="153" y="95" class="small">Программы</text>
      <circle cx="250" cy="42" r="58" fill="url(#redGrad)"/>
      <text x="231" y="58" style="fill:white;font-family:Arial;font-size:62px;">+</text>
      <text x="338" y="95" class="small">Прогресс</text>
      <text x="440" y="95" class="red">Мои</text>
    </g>
  </g>
</svg>
