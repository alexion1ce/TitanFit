<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111720"/>
      <stop offset="0.34" stop-color="#06080b"/>
      <stop offset="1" stop-color="#020304"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6656"/>
      <stop offset="1" stop-color="#ff332d"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19a98e"/>
      <stop offset="1" stop-color="#075240"/>
    </linearGradient>
    <linearGradient id="premiumCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3444"/>
      <stop offset="0.56" stop-color="#242732"/>
      <stop offset="1" stop-color="#15191f"/>
    </linearGradient>
    <style>
      .bg { fill:#030405; }
      .status { fill:#0f1319; }
      .h1 { fill:#f7f8fb; font-family:Inter,Arial,sans-serif; font-size:42px; font-weight:780; }
      .body { fill:#c1c6d0; font-family:Inter,Arial,sans-serif; font-size:22px; }
      .label { fill:#f5f6fa; font-family:Inter,Arial,sans-serif; font-size:28px; font-weight:760; }
      .muted { fill:#aeb5c2; font-family:Inter,Arial,sans-serif; font-size:21px; }
      .tiny { fill:#abb2bf; font-family:Inter,Arial,sans-serif; font-size:18px; font-weight:620; }
      .redText { fill:#ff5148; font-family:Inter,Arial,sans-serif; font-size:21px; font-weight:700; }
      .whiteButton { fill:#fff; font-family:Inter,Arial,sans-serif; font-size:24px; font-weight:760; }
      .cardStroke { stroke:#333845; stroke-width:1.5; }
      .icon { fill:none; stroke:#ffffff; stroke-width:4.4; stroke-linecap:round; stroke-linejoin:round; }
      .iconRed { fill:none; stroke:#ff5148; stroke-width:4.2; stroke-linecap:round; stroke-linejoin:round; }
      .iconMuted { fill:none; stroke:#b9bec8; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect width="720" height="1280" class="bg"/>
  <rect y="86" width="720" height="1090" fill="url(#screenGlow)"/>

  <!-- Status bar placeholder -->
  <rect width="720" height="86" class="status"/>
  <text x="44" y="52" class="body" style="font-weight:700;fill:#f6f7fa;">21:46</text>
  <rect x="220" y="14" width="280" height="56" rx="28" fill="#050607" stroke="#343a45"/>
  <text x="313" y="51" class="body" style="font-weight:760;fill:#f6f7fa;">Активно</text>
  <text x="560" y="52" class="body" style="font-weight:700;fill:#f6f7fa;">5G 95</text>

  <!-- Header -->
  <text x="32" y="178" class="h1">Мои тренировки</text>
  <text x="32" y="216" class="body">Выбери план на сегодня</text>

  <!-- Summary strip -->
  <g transform="translate(32 250)">
    <rect width="656" height="76" rx="24" fill="#10161e" stroke="#252d39"/>
    <g transform="translate(24 18)">
      <rect width="40" height="40" rx="13" fill="#241b1c"/>
      <path d="M12 22h16M20 14v16" class="iconRed"/>
    </g>
    <text x="82" y="33" class="tiny">2 тренировки</text>
    <text x="82" y="58" class="muted" style="font-size:18px;">Последняя: плечи</text>
    <rect x="472" y="16" width="160" height="44" rx="18" fill="#171e27"/>
    <text x="502" y="45" class="tiny">+ Быстрый план</text>
  </g>

  <!-- Main card 1 -->
  <g transform="translate(32 358)" filter="url(#cardShadow)">
    <rect width="656" height="234" rx="30" fill="url(#premiumCard)" class="cardStroke"/>
    <rect width="8" height="234" rx="4" fill="url(#redGrad)"/>
    <rect x="28" y="28" width="70" height="70" rx="22" fill="#0d5142"/>
    <path d="M49 51h24M49 66h17M49 81h29M72 80l18-18" class="icon"/>
    <text x="124" y="60" class="label">плечи</text>
    <text x="124" y="94" class="muted">Силовой день • верх тела</text>
    <circle cx="584" cy="64" r="42" fill="url(#tealGrad)"/>
    <path d="M576 44l28 20-28 20z" fill="#ffffff"/>

    <g transform="translate(124 124)">
      <rect width="108" height="42" rx="21" fill="#252b36"/>
      <text x="24" y="28" class="tiny">3 упр.</text>
      <rect x="122" width="130" height="42" rx="21" fill="#252b36"/>
      <text x="146" y="28" class="tiny">9 подходов</text>
      <rect x="266" width="104" height="42" rx="21" fill="#252b36"/>
      <text x="292" y="28" class="tiny">12 мин</text>
    </g>

    <g transform="translate(124 184)">
      <rect width="134" height="38" rx="19" fill="#2b1a1a"/>
      <path d="M22 25l19-19M36 6l7 7" class="iconRed"/>
      <text x="56" y="26" class="redText">Изменить</text>
      <rect x="154" width="122" height="38" rx="19" fill="#2b1a1a"/>
      <path d="M178 10h18M182 10v19M192 10v19M180 16h18" class="iconRed"/>
      <text x="210" y="26" class="redText">Удалить</text>
    </g>
  </g>

  <!-- Main card 2 -->
  <g transform="translate(32 622)" filter="url(#cardShadow)">
    <rect width="656" height="202" rx="30" fill="#15191f" stroke="#29313c" stroke-width="1.5"/>
    <rect x="28" y="28" width="70" height="70" rx="22" fill="#10262d"/>
    <path d="M49 51h24M49 66h17M49 81h29M72 80l18-18" class="icon"/>
    <text x="124" y="60" class="label">пятничная</text>
    <text x="124" y="94" class="muted">плечи и бицепс</text>
    <circle cx="584" cy="64" r="42" fill="#0d4f40"/>
    <path d="M576 44l28 20-28 20z" fill="#ffffff"/>

    <g transform="translate(124 124)">
      <rect width="108" height="42" rx="21" fill="#252b36"/>
      <text x="24" y="28" class="tiny">4 упр.</text>
      <rect x="122" width="112" height="42" rx="21" fill="#252b36"/>
      <text x="148" y="28" class="tiny">18 мин</text>
      <text x="286" y="28" class="redText">Изменить</text>
      <text x="418" y="28" class="redText">Удалить</text>
    </g>
  </g>

  <!-- Create button -->
  <rect x="32" y="868" width="656" height="82" rx="26" fill="url(#redGrad)" filter="url(#cardShadow)"/>
  <text x="217" y="919" class="whiteButton">+ Создать тренировку</text>

  <!-- Bottom navigation -->
  <g transform="translate(0 1086)">
    <rect width="720" height="126" rx="32" fill="#101319"/>
    <g transform="translate(60 30)">
      <path d="M5 34l24-24M29 34L5 10" class="iconMuted"/>
      <text x="-22" y="70" class="tiny">Каталог</text>
    </g>
    <g transform="translate(188 28)">
      <rect x="0" y="0" width="36" height="42" rx="4" fill="none" stroke="#b9bec8" stroke-width="4"/>
      <path d="M8 14h20M8 25h20" class="iconMuted"/>
      <text x="-34" y="72" class="tiny">Программы</text>
    </g>
    <circle cx="360" cy="28" r="66" fill="url(#redGrad)" filter="url(#cardShadow)"/>
    <text x="338" y="51" style="fill:white;font-family:Arial,sans-serif;font-size:76px;">+</text>
    <g transform="translate(486 28)">
      <rect x="0" y="0" width="36" height="42" rx="4" fill="none" stroke="#b9bec8" stroke-width="4"/>
      <path d="M10 30v-8M19 30V13M28 30V20" class="iconMuted"/>
      <text x="-28" y="72" class="tiny">Прогресс</text>
    </g>
    <g transform="translate(626 28)">
      <circle cx="18" cy="12" r="10" fill="none" stroke="#ff5148" stroke-width="4"/>
      <path d="M0 42c3-15 33-15 36 0" fill="none" stroke="#ff5148" stroke-width="4" stroke-linecap="round"/>
      <text x="-2" y="72" class="redText" style="font-size:18px;">Мои</text>
    </g>
  </g>

  <!-- Android system nav placeholder -->
  <g transform="translate(0 1212)">
    <rect width="720" height="68" fill="#030405"/>
    <rect x="196" y="23" width="28" height="28" rx="7" fill="#d8d8d8" opacity="0.9"/>
    <circle cx="360" cy="37" r="17" fill="none" stroke="#d8d8d8" stroke-width="4" opacity="0.9"/>
    <path d="M512 38l28-18v36z" fill="#d8d8d8" opacity="0.9"/>
  </g>
</svg>
